name: overlay

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - upstream.lock.json
      - .github/workflows/overlay.yml
      - .github/scripts/**
      - tests/**
      - compose/**
      - .env.example

  workflow_dispatch:
    inputs:
      skip_sync:
        description: Skip polling official Releases (rebuild current lock)
        type: boolean
        default: false

concurrency:
  group: overlay
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Sync official stable Release
        id: sync
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.skip_sync != true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/sync_upstream.py

      - name: Read lock
        id: lock
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          lock = json.loads(pathlib.Path("upstream.lock.json").read_text(encoding="utf-8"))
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"tag={lock['tag']}\n")
              handle.write(f"commit={lock['commit']}\n")
              handle.write(f"overlay_sha={sha}\n")
          PY

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide build
        id: decide
        run: |
          python3 .github/scripts/check_tags.py decide \
            --repo ghcr.io/agathonli/token-monitor-agent \
            --tags "${{ steps.lock.outputs.tag }}" latest "overlay-${{ steps.lock.outputs.overlay_sha }}" \
            --event "${{ github.event_name }}" \
            --changed "${{ steps.sync.outputs.changed }}"

      - name: Set up buildx
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build linux/amd64 (local load)
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: token-monitor-agent:smoke
          labels: |
            org.opencontainers.image.source=https://github.com/AgathonLi/token-monitor-agent
            org.opencontainers.image.revision=${{ steps.lock.outputs.overlay_sha }}
            org.opencontainers.image.version=${{ steps.lock.outputs.tag }}
            org.opencontainers.image.title=token-monitor-agent
            org.opencontainers.image.description=Unofficial Token Monitor headless-agent overlay. Not affiliated with Javis603/token-monitor.
            org.opencontainers.image.licenses=MIT

      - name: Smoke test image
        if: steps.decide.outputs.build == 'true'
        run: |
          python3 .github/scripts/smoke_image.py token-monitor-agent:smoke

      - name: Tag and push to GHCR
        if: steps.decide.outputs.build == 'true'
        run: |
          repo="ghcr.io/agathonli/token-monitor-agent"
          tag="${{ steps.lock.outputs.tag }}"
          sha="${{ steps.lock.outputs.overlay_sha }}"
          docker tag token-monitor-agent:smoke "${repo}:${tag}"
          docker push "${repo}:${tag}"
          docker tag token-monitor-agent:smoke "${repo}:latest"
          docker push "${repo}:latest"
          docker tag token-monitor-agent:smoke "${repo}:overlay-${sha}"
          docker push "${repo}:overlay-${sha}"

      - name: Verify published tags
        if: steps.decide.outputs.build == 'true'
        run: |
          expected="$(docker image inspect token-monitor-agent:smoke --format '{{.Id}}')"
          python3 .github/scripts/check_tags.py verify \
            --repo ghcr.io/agathonli/token-monitor-agent \
            --tags "${{ steps.lock.outputs.tag }}" latest "overlay-${{ steps.lock.outputs.overlay_sha }}" \
            --expected-digest "$expected"

      - name: Public GHCR package
        if: steps.decide.outputs.build == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user/packages/container/token-monitor-agent/visibility \
            -d '{"visibility":"public"}'
